<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Aladawi Paints Group Chatbot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B3D91"/>
      <stop offset="100%" stop-color="#13B0A6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background (rounded square) -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Chat bubble + shadow -->
  <g filter="url(#softShadow)">
    <path d="M320 312c0-61.9 50.1-112 112-112h256c61.9 0 112 50.1 112 112v204c0 61.9-50.1 112-112 112H486.5L374.8 717.2c-21.2 18.4-54.8 3.3-54.8-24.8v-64.4H432c-61.9 0-112-50.1-112-112V312z" fill="#FFFFFF" opacity="0.97"/>
  </g>

  <!-- Ellipsis dots -->
  <circle cx="456" cy="456" r="28" fill="#0B3D91" opacity="0.95"/>
  <circle cx="560" cy="456" r="28" fill="#0B3D91" opacity="0.95"/>
  <circle cx="664" cy="456" r="28" fill="#0B3D91" opacity="0.95"/>

  <!-- Paint drop (accent) -->
  <path d="M740 640c0-54-44-98-98-98s-98 44-98 98c0 70 61 120 98 164 37-44 98-94 98-164z" fill="#FFCC33" opacity="0.98"/>
  <circle cx="612" cy="666" r="16" fill="#FFFFFF" opacity="0.75"/>

  <!-- Subtle highlight ring -->
  <rect x="40" y="40" width="944" height="944" rx="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="18"/>
</svg>
